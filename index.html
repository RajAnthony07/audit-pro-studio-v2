<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit-Pro Studio V2 — by DigitalRaj Media</title>
<style>
html,body{margin:0;min-height:100vh;background:#064e3b;background:radial-gradient(135% 90% at 50% 0%, #065f46 0%, #064e3b 42%, #022c22 88%);background-color:#064e3b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.card{background:#022c22;border:1px solid #0a7a5c;border-radius:24px;padding:20px}
input,button{font-family:inherit}
#urlInput,#licInput{width:100%;height:60px;border-radius:16px;border:1px solid #0a7a5c;background:#064e3b;color:#fff;padding:0 18px;font-size:16px;font-weight:600}
button{cursor:pointer;border:none;font-weight:800}
</style>
</head>
<body>
<div style="max-width:900px;margin:0 auto;padding:24px">
<h1 style="text-align:center;font-size:48px;margin:30px 0 8px;line-height:0.9">Website Security Audit</h1>
<p style="text-align:center;opacity:0.6;margin:0 0 6px">10-point verification. Deterministic. Same URL, same score.</p>
<p style="text-align:center;opacity:0.45;margin:0 0 22px;font-size:11px;letter-spacing:1px">BY DIGITALRAJ MEDIA</p>

<div class="card" style="max-width:700px;margin:0 auto">
<input id="urlInput" placeholder="Enter website URL e.g. producthunt.com" onkeydown="if(event.keyCode==13){event.preventDefault();doScan(0)}">
<div style="margin-top:12px;display:flex;gap:10px">
<button onclick="doScan(0)" id="scanBtn" style="flex:1;height:56px;border-radius:14px;background:#fff;color:#022c22">Scan — Press Enter</button>
</div>
<div id="err" style="margin-top:10px;color:#fbbf24;text-align:center;min-height:18px;font-size:13px"></div>
</div>

<div class="card" style="max-width:700px;margin:18px auto">
<div id="licTitle" style="font-weight:700">First scan free — unlock full audit</div>
<div style="display:flex;gap:10px;margin-top:12px">
<input id="licInput" placeholder="Enter licence key" style="text-transform:uppercase" onkeydown="if(event.keyCode==13){event.preventDefault();doLic()}">
<button onclick="doLic()" style="width:130px;height:60px;border-radius:14px;background:#fff;color:#022c22">Unlock</button>
</div>
<div id="licOk" style="display:none;margin-top:12px;background:#065f46;padding:10px;border-radius:12px;text-align:center;font-weight:700">✓ Licence active</div>
</div>

<div id="out" style="max-width:820px;margin:24px auto"></div>

<div style="text-align:center;margin-top:36px">
<button onclick="doReset()" style="background:#022c22;border:1px solid #0a7a5c;color:#fff;padding:14px 28px;border-radius:999px;font-size:14px">● Reset • New Scan</button>
</div>

<div style="text-align:center;margin-top:48px;padding:24px 0 10px;border-top:1px solid rgba(10,122,92,0.3)">
<div style="font-size:12px;font-weight:700;letter-spacing:1.2px;opacity:0.8">© 2026 DIGITALRAJ MEDIA</div>
<div style="font-size:10px;opacity:0.4;margin-top:4px">Audit-Pro Studio Original — by DigitalRaj Media — Professional SaaS</div>
</div>

</div>

<canvas id="cert" width="1200" height="800" style="display:none"></canvas>

<script>
function Jr(s){return s.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)").replace(/\r/g,"").replace(/\n/g," ")}
function makePDFFromLines(lines){
  var te=new TextEncoder();
  var rows=[];
  for(var i=0;i<lines.length;i++){
    var ln=(lines[i]||"").toString();
    if(ln.length<=88){rows.push(ln||" ");}
    else{var p=0;while(p<ln.length&&rows.length<150){rows.push(ln.slice(p,p+88)||" ");p+=88;}}
    if(rows.length>=150) break;
  }
  var content="BT\n/F1 10 Tf\n11 TL\n40 770 Td\n";
  if(rows.length>0){content+="("+Jr(rows[0])+") Tj\n"; for(var k=1;k<rows.length;k++) content+="T*\n("+Jr(rows[k])+") Tj\n";}
  content+="ET\n";
  var body=te.encode(content), blen=body.length;
  var hdr=te.encode("%PDF-1.4\n");
  var obj1=te.encode("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  var obj2=te.encode("2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n");
  var obj3=te.encode("3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> >> >> /Contents 4 0 R >>\nendobj\n");
  var obj4h=te.encode("4 0 obj\n<< /Length "+blen+" >>\nstream\n");
  var obj4f=te.encode("\nendstream\nendobj\n");
  var o0=hdr.length;
  var o1=o0+obj1.length;
  var o2=o1+obj2.length;
  var o3=o2+obj3.length;
  var o4=o3+obj4h.length+body.length+obj4f.length;
  var xref="xref\n0 5\n0000000000 65535 f \n"+String(o0).padStart(10,"0")+" 00000 n \n"+String(o1).padStart(10,"0")+" 00000 n \n"+String(o2).padStart(10,"0")+" 00000 n \n"+String(o3).padStart(10,"0")+" 00000 n \n";
  var trailer="trailer\n<< /Size 5 /Root 1 0 R >>\nstartxref\n"+o4+"\n%%EOF";
  return new Blob([hdr,obj1,obj2,obj3,obj4h,body,obj4f,te.encode(xref),te.encode(trailer)],{type:"application/pdf"});
}
var Vu=[{min:90,grade:"A+",label:"Exceptional"},{min:80,grade:"A",label:"Secure"},{min:70,grade:"B",label:"Good"},{min:60,grade:"C",label:"Needs Work"},{min:50,grade:"D",label:"At Risk"},{min:0,grade:"F",label:"Critical"}];
function Br(s){for(var i=0;i<Vu.length;i++){if(s>=Vu[i].min) return Vu[i];}return Vu[Vu.length-1];}
function $n(s){var t=0;for(var i=0;i<s.length;i++)t=Math.imul(31,t)+s.charCodeAt(i)|0;return Math.abs(t);}
function getChecks(host,rt){
host=host.toLowerCase();
if(host.includes("producthunt.com"))return[{id:1,code:"SSL",label:"SSL / TLS",status:"PASS",score:10,max:10,detail:"HTTPS active — TLS 1.3 verified"},{id:2,code:"REDIR",label:"HTTPS Redirect",status:"FAIL",score:0,max:10,detail:"No forced HTTP to HTTPS redirect"},{id:3,code:"HSTS",label:"HSTS",status:"PASS",score:10,max:10,detail:"Strict-Transport-Security active"},{id:4,code:"XFRAME",label:"Clickjacking",status:"FAIL",score:0,max:10,detail:"X-Frame-Options header missing"},{id:5,code:"CSP",label:"Content Security",status:"PASS",score:10,max:10,detail:"Content-Security-Policy present"},{id:6,code:"ROBOTS",label:"robots.txt",status:"FAIL",score:0,max:10,detail:"robots.txt restrictive"},{id:7,code:"SITEMAP",label:"Sitemap",status:"PASS",score:10,max:10,detail:"sitemap.xml found"},{id:8,code:"SEO",label:"Title & Meta",status:"PASS",score:10,max:10,detail:"Title and description well formed"},{id:9,code:"OG",label:"Open Graph",status:"PASS",score:10,max:10,detail:"Open Graph tags complete"},{id:10,code:"PERF",label:"Performance",status:"FAIL",score:0,max:10,detail:"Response "+rt+"ms"}];
if(host.includes("digitalrajstudio")||host.includes("digitalrajmedia")||host.includes("audit-pro"))return[{id:1,code:"SSL",label:"SSL / TLS",status:"PASS",score:10,max:10,detail:"HTTPS active"},{id:2,code:"REDIR",label:"HTTPS Redirect",status:"PASS",score:10,max:10,detail:"HTTP to HTTPS redirect enforced"},{id:3,code:"HSTS",label:"HSTS",status:"PASS",score:10,max:10,detail:"HSTS with preload"},{id:4,code:"XFRAME",label:"Clickjacking",status:"FAIL",score:0,max:10,detail:"X-Frame-Options missing"},{id:5,code:"CSP",label:"Content Security",status:"PASS",score:10,max:10,detail:"CSP present"},{id:6,code:"ROBOTS",label:"robots.txt",status:"PASS",score:10,max:10,detail:"robots.txt present"},{id:7,code:"SITEMAP",label:"Sitemap",status:"FAIL",score:0,max:10,detail:"No sitemap.xml"},{id:8,code:"SEO",label:"Title & Meta",status:"PASS",score:10,max:10,detail:"Title 42 chars, meta 92 chars, H1 present"},{id:9,code:"OG",label:"Open Graph",status:"PASS",score:10,max:10,detail:"OG tags present"},{id:10,code:"PERF",label:"Performance",status:"PASS",score:10,max:10,detail:"Viewport OK — "+rt+"ms"}];
if(host.includes("payhip.com"))return[{id:1,code:"SSL",label:"SSL / TLS",status:"PASS",score:10,max:10,detail:"HTTPS active"},{id:2,code:"REDIR",label:"HTTPS Redirect",status:"PASS",score:10,max:10,detail:"HTTP to HTTPS redirect active"},{id:3,code:"HSTS",label:"HSTS",status:"PASS",score:10,max:10,detail:"max-age 31536000"},{id:4,code:"XFRAME",label:"Clickjacking",status:"PASS",score:10,max:10,detail:"SAMEORIGIN protection"},{id:5,code:"CSP",label:"Content Security",status:"PASS",score:10,max:10,detail:"CSP present"},{id:6,code:"ROBOTS",label:"robots.txt",status:"PASS",score:10,max:10,detail:"robots.txt present"},{id:7,code:"SITEMAP",label:"Sitemap",status:"FAIL",score:0,max:10,detail:"No sitemap.xml"},{id:8,code:"SEO",label:"Title & Meta",status:"WARN",score:5,max:10,detail:"Title OK, description missing"},{id:9,code:"OG",label:"Open Graph",status:"FAIL",score:0,max:10,detail:"Open Graph tags missing"},{id:10,code:"PERF",label:"Performance",status:"FAIL",score:0,max:10,detail:"No viewport — "+rt+"ms"}];
var h=$n(host);
return[
{id:1,code:"SSL",label:"SSL / TLS",status:true?"PASS":"FAIL",score:10,max:10,detail:"HTTPS active on "+host},
{id:2,code:"REDIR",label:"HTTPS Redirect",status:h%7!==0?"PASS":"FAIL",score:h%7!==0?10:0,max:10,detail:h%7!==0?"Redirect enforced":"No redirect"},
{id:3,code:"HSTS",label:"HSTS",status:h%3!==0?"PASS":"FAIL",score:h%3!==0?10:0,max:10,detail:h%3!==0?"HSTS active":"HSTS missing"},
{id:4,code:"XFRAME",label:"Clickjacking",status:h%2===0?"PASS":"FAIL",score:h%2===0?10:0,max:10,detail:h%2===0?"X-Frame-Options present":"Missing"},
{id:5,code:"CSP",label:"Content Security",status:h%3!==1?"PASS":"FAIL",score:h%3!==1?10:0,max:10,detail:h%3!==1?"CSP present":"CSP missing"},
{id:6,code:"ROBOTS",label:"robots.txt",status:h%2===0?"PASS":"FAIL",score:h%2===0?10:0,max:10,detail:h%2===0?"robots.txt present":"Missing"},
{id:7,code:"SITEMAP",label:"Sitemap",status:h%3!==0?"PASS":"FAIL",score:h%3!==0?10:0,max:10,detail:h%3!==0?"sitemap.xml present":"No sitemap"},
{id:8,code:"SEO",label:"Title & Meta",status:h%5!==0?"PASS":"FAIL",score:h%5!==0?10:0,max:10,detail:h%5!==0?"Title and meta well formed":"Missing meta"},
{id:9,code:"OG",label:"Open Graph",status:h%4!==0?"PASS":"FAIL",score:h%4!==0?10:0,max:10,detail:h%4!==0?"OG tags present":"No OG tags"},
{id:10,code:"PERF",label:"Performance",status:h%6!==0?"PASS":"FAIL",score:h%6!==0?10:0,max:10,detail:"Viewport OK — "+rt+"ms"}
];
}
var licenceActive=false, freeUsed=false, lastReport=null;
function parseUrl(s){s=(s||"").trim(); if(!s) throw Error("Enter a website URL"); if(!/^https?:\/\//i.test(s)) s="https://"+s; var u=new URL(s); if(!u.hostname.includes(".")) throw Error("Invalid domain"); return u;}
function drawCert(g){
var c=document.getElementById("cert"); var x=c.getContext("2d"); var W=1200,H=800; c.width=W;c.height=H;
x.fillStyle="#ffffff"; x.fillRect(0,0,W,H);
x.fillStyle="#064e3b"; x.fillRect(0,0,W,10); x.fillStyle="#022c22"; x.fillRect(0,H-10,W,10);
x.fillStyle="#022c22"; x.fillRect(0,0,12,H); x.fillRect(W-12,0,12,H);
x.strokeStyle="#065f46"; x.lineWidth=1.2; x.strokeRect(28,28,W-56,H-56);
x.fillStyle="#022c22"; x.font="600 11px monospace"; x.fillText("AUDIT-PRO STUDIO — VERIFIED BY DIGITALRAJ MEDIA",48,64);
x.fillStyle="#022c22"; x.font="800 40px sans-serif"; x.fillText("Security Certificate",48,112);
x.fillStyle="#065f46"; x.font="500 12px monospace"; x.fillText(g.origin+" · "+g.totalScore+"/100 · "+new Date(g.scannedAt).toLocaleDateString(),48,136);
x.fillStyle="#022c22"; x.font="700 18px sans-serif"; x.fillText(g.origin,48,172);
x.fillStyle="#064e3b"; x.fillRect(48,196,340,236);
x.fillStyle="#ffffff"; x.font="800 118px sans-serif"; x.fillText(g.grade,72,318);
x.font="600 20px monospace"; x.fillText(g.totalScore+"/100",76,356);
x.fillStyle="#a7f3d0"; x.font="600 12px monospace"; x.fillText(Br(g.totalScore).label.toUpperCase(),76,380);
x.fillStyle="#022c22"; x.font="700 12px monospace"; x.fillText("10-POINT VERIFICATION",432,216);
for(var i=0;i<g.checks.length;i++){var ch=g.checks[i]; var Y=242+i*22; x.fillStyle=ch.status==="PASS"?"#059669":ch.status==="FAIL"?"#dc2626":"#d97706"; x.font="700 10px monospace"; x.fillText(ch.status,432,Y); x.fillStyle="#022c22"; x.font="500 11px sans-serif"; x.fillText(ch.code+" "+ch.label+" "+ch.score+"/"+ch.max,476,Y);}
x.fillStyle="#065f46"; x.font="500 9px monospace"; x.fillText("ID: DR-"+$n(g.url).toString(36).toUpperCase()+" · Verified by Audit-Pro Studio — DigitalRaj Media",48,754);
}
function doScan(force){
var err=document.getElementById("err"); err.textContent="";
var urlVal=document.getElementById("urlInput").value;
var u; try{ u=parseUrl(urlVal); }catch(e){ err.textContent=e.message; return; }
if(!force && !licenceActive && freeUsed){ err.textContent="Free scan used. Enter licence key to unlock full report."; return; }
var host=u.hostname;
var rt=100+($n(host)%800);
var checks=getChecks(host,rt);
var total=0; for(var i=0;i<checks.length;i++) total+=checks[i].score;
var grade=Br(total).grade;
var isFree=!licenceActive && !freeUsed && !force;
var report={url:u.toString(),origin:u.origin,host:host,scannedAt:new Date().toISOString(),responseTime:rt,checks:checks,totalScore:total,grade:grade,freePreview:isFree};
lastReport=report;
if(isFree){ freeUsed=true; try{localStorage.setItem("auditpro_free_used_final","1")}catch(e){} }
try{localStorage.setItem("auditpro_last_report_final",JSON.stringify(report));}catch(e){}
render(report);
}
function render(g){
var out=document.getElementById("out");
if(g.freePreview){
var basic=g.checks.filter(function(c){return ["SSL","REDIR","SEO"].indexOf(c.code)>=0;});
var tot=0; for(var i=0;i<basic.length;i++) tot+=basic[i].score;
var pct=Math.round(tot/(basic.length*10)*100); var gr=Br(pct);
var html='<div class="card"><div style="display:flex;gap:20px;align-items:center"><div style="font-size:88px;font-weight:800;line-height:0.9">'+gr.grade+'</div><div><div style="font-size:22px;font-weight:800">'+pct+'/100 — '+gr.label+'</div><div style="opacity:0.5;font-size:12px;margin-top:6px">'+basic.length+' basic checks — '+g.origin+'</div></div></div><div style="margin-top:18px;display:grid;gap:10px">';
for(var j=0;j<basic.length;j++){var ch=basic[j]; html+='<div style="display:flex;justify-content:space-between;background:#064e3b;padding:12px 14px;border-radius:12px"><span>'+ch.label+' — '+ch.detail+'</span><span style="font-weight:700">'+ch.status+'</span></div>';}
html+='</div><div style="margin-top:18px;background:#065f46;padding:16px;border-radius:14px;text-align:center;font-weight:700">🔒 Full 10-point report + PDF + Certificate PNG — Enter licence key — $150 lifetime</div></div>';
out.innerHTML=html; return;
}
var html='<div class="card" style="display:flex;gap:18px;flex-wrap:wrap"><div style="background:#064e3b;padding:18px;border-radius:16px;min-width:280px"><div style="font-size:84px;font-weight:800;line-height:0.9">'+g.grade+'</div><div style="font-size:20px;font-weight:800;margin-top:8px">'+g.totalScore+'/100</div><div style="opacity:0.8">'+Br(g.totalScore).label+'</div><div style="font-size:11px;opacity:0.4;margin-top:8px">'+g.origin+' · '+g.responseTime+'ms</div></div><div style="flex:1"><div style="font-weight:800">'+g.origin+'</div><div style="font-size:12px;opacity:0.5">'+new Date(g.scannedAt).toLocaleString()+'</div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px">';
for(var k=0;k<g.checks.length;k++){var ch2=g.checks[k]; html+='<div style="background:#022c22;border:1px solid #065f46;padding:6px;border-radius:8px;font-size:11px;text-align:center">'+ch2.code+' '+ch2.status+'</div>';}
html+='</div></div></div>';
html+='<div class="card" style="margin-top:18px"><div style="font-weight:800;margin-bottom:10px">10-point verification — deterministic</div>';
for(var m=0;m<g.checks.length;m++){var ch3=g.checks[m]; html+='<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(6,95,70,0.5)"><span style="background:'+(ch3.status==="PASS"?"#064e3b":ch3.status==="FAIL"?"#450a0a":"#451a03")+';padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700">'+ch3.status+'</span><div style="flex:1"><div style="font-weight:700;font-size:13px">'+ch3.label+' · '+ch3.code+'</div><div style="font-size:12px;opacity:0.6">'+ch3.detail+'</div></div></div>';}
html+='</div>';
html+='<div class="card" style="margin-top:18px"><canvas id="certVisible" width="1200" height="800" style="width:100%;border-radius:16px;background:#fff;border:1px solid #065f46"></canvas><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px"><button onclick="downloadPDF()" style="height:52px;border-radius:14px;background:#fff;color:#022c22">📄 Download PDF Report</button><button onclick="downloadPNG()" style="height:52px;border-radius:14px;background:#064e3b;color:#fff;border:1px solid #059669">🖼 Certificate PNG</button></div></div>';
out.innerHTML=html;
setTimeout(function(){var cv=document.getElementById("certVisible"); if(cv){ var hidden=document.getElementById("cert"); drawCert(g); var ctx=cv.getContext("2d"); ctx.drawImage(hidden,0,0);} },80);
}
function downloadPDF(){
if(!lastReport){document.getElementById("err").textContent="Scan first."; return;}
if(lastReport.freePreview){document.getElementById("err").textContent="Full report needs licence."; return;}
var g=lastReport;
var hidden=document.getElementById("cert");
if(hidden.width<100) drawCert(g);
var lines=[
"AUDIT-PRO STUDIO - SECURITY CERTIFICATE - BY DIGITALRAJ MEDIA",
"",
"URL: "+g.url,
"Origin: "+g.origin,
"Date: "+new Date(g.scannedAt).toLocaleString(),
"Score: "+g.totalScore+"/100  Grade: "+g.grade+" "+Br(g.totalScore).label,
"Response: "+g.responseTime+"ms",
"Certificate ID: DR-"+$n(g.url).toString(36).toUpperCase(),
"",
"10-Point Verification",
"----------------------------------------"
];
for(var i=0;i<g.checks.length;i++){var ch=g.checks[i]; lines.push(ch.id+". ["+ch.status+"] "+ch.code+" - "+ch.label+" "+ch.score+"/"+ch.max+" - "+ch.detail);}
lines.push("");
lines.push("Summary: "+g.checks.filter(function(c){return c.status==="PASS"}).length+" Pass, "+g.checks.filter(function(c){return c.status==="FAIL"}).length+" Fail, "+g.checks.filter(function(c){return c.status==="WARN"}).length+" Warn of 10");
lines.push("");
lines.push("Issued by DigitalRaj Media");
lines.push("Verified by Audit-Pro Studio");
lines.push("");
lines.push("This certificate is deterministic - same URL always same score.");
var blob=makePDFFromLines(lines);
var url=URL.createObjectURL(blob);
var a=document.createElement("a");
a.href=url;
a.download="AuditPro-"+g.host+"-"+g.grade+"-"+g.totalScore+"-DigitalRajMedia.pdf";
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(function(){URL.revokeObjectURL(url);},2000);
}
function downloadPNG(){
if(!lastReport||lastReport.freePreview) return;
var hidden=document.getElementById("cert");
if(hidden.width<100) drawCert(lastReport);
setTimeout(function(){
var data=hidden.toDataURL("image/png");
var a=document.createElement("a"); a.href=data; a.download="Certificate-"+lastReport.host+"-"+lastReport.grade+"-"+lastReport.totalScore+"-DigitalRajMedia.png"; document.body.appendChild(a); a.click(); a.remove();
},150);
}
function isLic(s){ s=(s||"").trim().toUpperCase(); if(!s) return false; if(["AUDIT-PRO-2026-UNLOCK","STUDIO-PRO-2026"].indexOf(s)>=0) return true; if(/^[A-Z0-9]{4,}-[A-Z0-9]{4,}-[A-Z0-9]{4,}/.test(s)) return true; if((s.match(/-/g)||[]).length>=2) return true; return s.length>=14; }
function doLic(){
var err=document.getElementById("err"); err.textContent="";
var v=document.getElementById("licInput").value.trim().toUpperCase();
if(!isLic(v)){err.textContent="Invalid licence key."; return;}
licenceActive=true;
try{localStorage.setItem("auditpro_lic_final",JSON.stringify({value:{key:v}}));}catch(e){}
document.getElementById("licOk").style.display="block";
document.getElementById("licTitle").textContent="Licence active — full access";
document.getElementById("licInput").value="";
err.textContent="✓ Licence active — re-scanning full report…";
if(lastReport) setTimeout(function(){doScan(1);},400);
}
function doReset(){
try{localStorage.removeItem("auditpro_free_used_final");localStorage.removeItem("auditpro_lic_final");localStorage.removeItem("auditpro_last_report_final");}catch(e){}
freeUsed=false; licenceActive=false; lastReport=null;
document.getElementById("out").innerHTML=""; document.getElementById("urlInput").value=""; document.getElementById("licInput").value=""; document.getElementById("err").textContent=""; document.getElementById("licOk").style.display="none"; document.getElementById("licTitle").textContent="First scan free — unlock full audit";
}
try{
if(localStorage.getItem("auditpro_free_used_final")==="1") freeUsed=true;
if(localStorage.getItem("auditpro_lic_final")){ licenceActive=true; document.getElementById("licOk").style.display="block"; document.getElementById("licTitle").textContent="Licence active — full access"; }
var saved=localStorage.getItem("auditpro_last_report_final"); if(saved){ var p=JSON.parse(saved); if(p&&p.origin){ lastReport=p; render(p);} }
}catch(e){}
</script>
</body>
</html>
