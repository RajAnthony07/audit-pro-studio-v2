  --tw-shadow-colored: 0 6px 20px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.shadow-sm{
  --tw-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --tw-shadow-colored: 0 1px 2px 0 var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.outline-none{
  outline: 2px solid transparent;
  outline-offset: 2px;
}

.ring-1{
  --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);
  --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(1px + var(--tw-ring-offset-width)) var(--tw-ring-color);
  box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
}

.ring-emerald-700\/60{
  --tw-ring-color: rgb(4 120 87 / 0.6);
}

.ring-white\/20{
  --tw-ring-color: rgb(255 255 255 / 0.2);
}

.blur-\[10px\]{
  --tw-blur: blur(10px);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.backdrop-blur-\[14px\]{
  --tw-backdrop-blur: blur(14px);
  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
}

.backdrop-blur-xl{
  --tw-backdrop-blur: blur(24px);
  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
}

.transition{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-all{
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-colors{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root {
  --bg: #064e3b;
  --surface: #022c22;
  --surface-2: #064e3b;
  --ink: #ffffff;
  --muted: #a7f3d0;
  --line: #065f46;
  --line-strong: #047857;
  --emerald: #064e3b;
  --emerald-light: #065f46;
  --emerald-dark: #022c22;
  --emerald-800: #065f46;
  --emerald-900: #064e3b;
  --emerald-950: #022c22;
}

* {
  font-variant-ligatures: common-ligatures;
}

html, body {
  background: #064e3b;
  background: radial-gradient(135% 90% at 50% 0%, #065f46 0%, #064e3b 42%, #022c22 88%);
  background-color: #064e3b;
  color: #ffffff;
  font-family: "Plus Jakarta Sans", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
}

/* Deep emerald scrollbar */

::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: #022c22;
}

::-webkit-scrollbar-thumb {
  background: #065f46;
  border-radius: 8px;
  border: 1px solid #064e3b;
}

::-webkit-scrollbar-thumb:hover {
  background: #047857;
}

.placeholder\:text-emerald-200\/25::-moz-placeholder{
  color: rgb(167 243 208 / 0.25);
}

.placeholder\:text-emerald-200\/25::placeholder{
  color: rgb(167 243 208 / 0.25);
}

.placeholder\:text-emerald-200\/30::-moz-placeholder{
  color: rgb(167 243 208 / 0.3);
}

.placeholder\:text-emerald-200\/30::placeholder{
  color: rgb(167 243 208 / 0.3);
}

.hover\:border-emerald-600:hover{
  --tw-border-opacity: 1;
  border-color: rgb(5 150 105 / var(--tw-border-opacity, 1));
}

.hover\:bg-\[\#064e3b\]:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(6 78 59 / var(--tw-bg-opacity, 1));
}

.hover\:bg-\[\#064e3b\]\/20:hover{
  background-color: rgb(6 78 59 / 0.2);
}

.hover\:bg-\[\#065f46\]:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(6 95 70 / var(--tw-bg-opacity, 1));
}

.hover\:bg-emerald-50:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(236 253 245 / var(--tw-bg-opacity, 1));
}

.hover\:text-white:hover{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.focus\:border-emerald-400:focus{
  --tw-border-opacity: 1;
  border-color: rgb(52 211 153 / var(--tw-border-opacity, 1));
}

.focus\:bg-\[\#065f46\]:focus{
  --tw-bg-opacity: 1;
  background-color: rgb(6 95 70 / var(--tw-bg-opacity, 1));
}

.active\:bg-emerald-100:active{
  --tw-bg-opacity: 1;
  background-color: rgb(209 250 229 / var(--tw-bg-opacity, 1));
}

.disabled\:opacity-60:disabled{
  opacity: 0.6;
}

@media (min-width: 640px){
  .sm\:w-\[128px\]{
    width: 128px;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:flex-row{
    flex-direction: row;
  }
}

@media (min-width: 768px){
  .md\:block{
    display: block;
  }

  .md\:inline-flex{
    display: inline-flex;
  }

  .md\:w-\[132px\]{
    width: 132px;
  }

  .md\:w-\[300px\]{
    width: 300px;
  }

  .md\:w-\[320px\]{
    width: 320px;
  }

  .md\:grid-cols-5{
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }

  .md\:flex-row{
    flex-direction: row;
  }

  .md\:items-start{
    align-items: flex-start;
  }

  .md\:justify-between{
    justify-content: space-between;
  }

  .md\:p-10{
    padding: 2.5rem;
  }

  .md\:p-6{
    padding: 1.5rem;
  }

  .md\:p-7{
    padding: 1.75rem;
  }

  .md\:p-8{
    padding: 2rem;
  }

  .md\:p-9{
    padding: 2.25rem;
  }

  .md\:p-\[14px\]{
    padding: 14px;
  }

  .md\:px-8{
    padding-left: 2rem;
    padding-right: 2rem;
  }

  .md\:pt-16{
    padding-top: 4rem;
  }

  .md\:text-left{
    text-align: left;
  }

  .md\:text-\[100px\]{
    font-size: 100px;
  }

  .md\:text-\[18px\]{
    font-size: 18px;
  }

  .md\:text-\[72px\]{
    font-size: 72px;
  }
}
